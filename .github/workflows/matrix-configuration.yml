name: Matrix Configuration Demo

on:
  push:
  workflow_dispatch:

jobs:
  matrix-deploy:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # Özel değişken isimleri (os, images vb.)
        os: [ubuntu-latest, ubuntu-20.04, windows-latest]
        images: [hello-world, alpine]

    steps:
      - name: Docker Bilgisini Kontrol Et
        run: docker info

      - name: ${{ matrix.images }} Imajini ${{ matrix.os }} Üzerinde Calistir
        run: docker run ${{ matrix.images }}