name: Sequential Multi-Job Workflow

on: push

jobs:
  # 1. AŞAMA: BUILD
  build_job_1:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies and build
        run: |
          sudo apt-get install -y cowsay
          cowsay -f dragon "Build Phase" > dragon.txt
      - name: Sleep for 30 seconds
        run: sleep 30    

  # 2. AŞAMA: TEST (build_job_1 bitmeden BAŞLAMAZ)
  test_job_2:
    runs-on: ubuntu-latest
    needs: build_job_1
    steps:
      - name: Sleep for 10 seconds
        run: sleep 10
        
      - name: Test output file
        run: grep -i "Build" dragon.txt
            

  # 3. AŞAMA: DEPLOY (test_job_2 bitmeden BAŞLAMAZ)
  deploy_job_3:
    runs-on: ubuntu-latest
    needs: test_job_2
    steps:
      - name: Read File
        run: cat dragon.txt

          