name: Exploring Variables and Secrets

on: push

# 1. WORKFLOW SEVİYESİ (Tüm job'lar erişebilir)
env:
  CONTAINER_REGISTRY: docker.io
  IMAGE_NAME: nginx-app

jobs:
  docker_job:
    runs-on: ubuntu-latest
    
    # 2. JOB SEVİYESİ (Sadece bu job altındaki step'ler erişebilir)
    env:
      DOCKER_USER: siddharth1

    steps:
      - name: Build Docker Image
        run: |
          echo "Building for registry: ${{ env.CONTAINER_REGISTRY }}"
          echo "Image: $DOCKER_USER/$IMAGE_NAME"

      - name: Docker Login
        # 3. STEP SEVİYESİ (Sadece bu adıma özel)
        env:
          DOCKER_PASSWORD: plainTextPassword123 # DİKKAT: Güvenli değil!
        run: |
          echo "Logging in as $DOCKER_USER with password $DOCKER_PASSWORD"

  deploy_job:
    runs-on: ubuntu-latest
    needs: docker_job
    steps:
      - name: Deploy Image
        run: |
          # CONTAINER_REGISTRY ve IMAGE_NAME erişilebilir (Workflow seviyesi)
          # Ancak DOCKER_USER değişkenine burada ERİŞİLEMEZ (Job seviyesindeydi)
          echo "Deploying ${{ env.CONTAINER_REGISTRY }}/$IMAGE_NAME"